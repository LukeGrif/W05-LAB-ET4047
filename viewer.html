<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 05 Lab</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  /* Pages flow left-to-right and wrap: 1 column when narrow, 2 side by side when wide */
  #viewer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    margin: 0 auto;
    background: #ffffff;
  }
  #viewer canvas {
    display: block;
    margin: 0;       /* no breaks between pages */
    padding: 0;
    background: #ffffff;
  }
  #status {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #888;
    text-align: center;
    padding: 40px 20px;
    width: 100%;
  }
  /* Fixed "back to main menu" button */
  .menu-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #2563eb;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 24px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .menu-btn:hover { background: #1d4ed8; transform: translateY(-1px); }
  .menu-btn.change { left: auto; right: 16px; background: #165E3A; }
  .menu-btn.change:hover { background: #0f4a2d; }
  .menu-btn svg { width: 16px; height: 16px; }
  @media (max-width: 600px) {
    .menu-btn { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
  <a class="menu-btn" href="https://lukegrif.github.io/LAB-ET4047/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Main Menu
  </a>
  <a class="menu-btn change" href="./">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
    Week 05
  </a>

  <div id="viewer"><div id="status">Loading lab report…</div></div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

    // The Week 05 lab; the landing page (index.html) links here with ?lab=uart
    const LABS = {
      uart: { title: "UART Communication and Data Integrity",
              pdf: "W05_LAB_UART_Communication_and_Data_Integrity.pdf" },
    };
    // Only one lab this week, so open it even without ?lab=
    const lab = LABS[new URLSearchParams(location.search).get("lab")] || LABS.uart;
    document.title = "Week 05 — " + lab.title;
    const PDF_URL = lab.pdf;
    const MAX_PAGE_WIDTH = 850;    // a page won't render wider than this
    const TWO_UP_MIN = 960;        // window must be at least this wide to show 2 pages
    const viewer = document.getElementById("viewer");
    let pdfDoc = null;

    function layout() {
      const columns = window.innerWidth >= TWO_UP_MIN ? 2 : 1;
      const pageWidth = Math.min(Math.floor(window.innerWidth / columns), MAX_PAGE_WIDTH);
      // lock the row to exactly `columns` pages wide so wrapping is precise
      viewer.style.width = (columns * pageWidth) + "px";
      return pageWidth;
    }

    async function render() {
      const width = layout();
      const dpr = window.devicePixelRatio || 1;
      viewer.innerHTML = "";
      for (let n = 1; n <= pdfDoc.numPages; n++) {
        const page = await pdfDoc.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const scale = width / base.width;
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = width + "px";
        canvas.style.height = (viewport.height / dpr) + "px";
        viewer.appendChild(canvas);

        await page.render({
          canvasContext: canvas.getContext("2d"),
          viewport,
        }).promise;
      }
    }

    // Re-render on resize / zoom (debounced) so pages stay sharp and re-flow
    let t;
    window.addEventListener("resize", () => {
      clearTimeout(t);
      t = setTimeout(render, 200);
    });

    (async () => {
      try {
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        await render();
      } catch (e) {
        document.getElementById("status").textContent =
          "Could not load the PDF. Please refresh the page.";
        console.error(e);
      }
    })();
  </script>
</body>
</html>
